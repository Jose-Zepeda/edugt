<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduGT — Completa tu cuenta</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo-mark-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/app.css?v=20261015_04" rel="stylesheet">
</head>
<body class="auth-body">

<main class="container py-4 my-auto" style="max-width: 480px;">
  <div class="text-center mb-4 pt-2 auth-brand-header">
    <img src="assets/img/logo-mark-64.png" alt="Logo EduGT" width="56" height="56" style="border-radius:18px;" class="mx-auto mb-3 d-block shadow-sm">
    <h1 class="h5 fw-bold mb-1 auth-brand-title" id="saludo">Resta un paso</h1>
    <p class="mb-0 auth-brand-subtitle" id="subtitulo">Autenticaste con Google. Elige cómo usar EduGT.</p>
  </div>

  <div id="alert" class="alert d-none"></div>

  <!-- ========== CASO 1: cuenta nueva → elegir rol ========== -->
  <section id="view-rol" class="card-edugt auth-card p-4 p-md-5 d-none">
    <form id="form-rol">
      <div class="text-center mb-4">
        <img id="foto-google" src="" alt="" width="64" height="64" style="border-radius:50%;object-fit:cover;" class="mb-2">
        <div class="fw-bold auth-card-title" id="nombre-google">—</div>
        <small class="auth-divider-text" id="email-google">—</small>
      </div>

      <fieldset class="mb-4">
        <legend class="form-label fw-bold auth-label" style="font-size:1rem;">¿Cómo vas a usar EduGT?</legend>
        <div class="d-grid gap-2">
          <label class="auth-role-option border rounded-3 p-3 d-flex align-items-center gap-3">
            <input type="radio" name="role" value="student" checked style="accent-color:var(--edugt-primary);width:1.15rem;height:1.15rem;">
            <i class="bi bi-mortarboard-fill auth-role-icon" style="font-size:1.25rem;"></i>
            <span><strong class="auth-role-title">Estudiante</strong><br><small class="auth-role-sub">Aprende, gana XP y compite sanamente</small></span>
          </label>
          <label class="auth-role-option border rounded-3 p-3 d-flex align-items-center gap-3">
            <input type="radio" name="role" value="teacher" style="accent-color:var(--edugt-primary);width:1.15rem;height:1.15rem;">
            <i class="bi bi-person-video3 auth-role-icon" style="font-size:1.25rem;"></i>
            <span><strong class="auth-role-title">Docente</strong><br><small class="auth-role-sub">Requiere aprobación del administrador</small></span>
          </label>
        </div>
        <!-- RB-01: admin nunca como opción -->
        <input type="hidden" name="google_id" id="google_id">
        <input type="hidden" name="email" id="email">
        <input type="hidden" name="avatar_url" id="avatar_url">
      </fieldset>

      <button type="submit" class="btn btn-edugt w-100 mb-2" id="btn-completar">Continuar</button>
      <a href="index.html" class="btn btn-google w-100 text-center">Cancelar</a>
    </form>
  </section>

  <!-- ========== CASO 2: cuenta existente → sesión iniciada ========== -->
  <section id="view-sesion" class="card-edugt auth-card p-5 text-center d-none">
    <div class="stat-icon mx-auto mb-3" style="width:72px;height:72px;background:var(--edugt-green-soft);color:var(--edugt-green)">
      <i class="bi bi-check-lg" style="font-size:2rem"></i>
    </div>
    <h2 class="h5 fw-bold auth-card-title" id="bienvenida">—</h2>
    <p class="auth-divider-text">Iniciaste sesión con Google.</p>
    <a class="btn btn-edugt btn-lg w-100" id="btn-ir" href="#">Continuar a mi panel</a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js?v=20261020_03"></script>
<script>
'use strict';

const qs = new URLSearchParams(window.location.search);
const escLocal = esc; // helper de api.js

const TOKEN = qs.get('token');
const googleId = qs.get('google_id');
const email = qs.get('email');
const nombre = qs.get('name') ?? '';
const avatar = qs.get('avatar_url') ?? '';

// google_status=pending → mensaje en el login (vuelven a index con alerta)
if (qs.get('google_status') === 'pending') {
  window.location.href = 'index.html?google_status=pending';
}

async function boot() {
  // ---- CASO 2: login existente con token listo ----
  if (TOKEN) {
    try {
      const res = await fetch(`${API_BASE}/me`, { headers: { Authorization: `Bearer ${TOKEN}`, Accept: 'application/json' } });
      if (res.ok) {
        const payload = await res.json();
        Auth.clear();
        Auth.save(TOKEN, payload.user);

        const target = payload.user.role === 'teacher' ? 'docente.html'
          : payload.user.role === 'admin' ? 'admin.html' : 'estudiante.html';
        window.location.href = target;
        return;
      }
    } catch (e) {
      console.error('Error cargando usuario de Google:', e);
    }
  }

  // ---- CASO 1: elegir rol ----
  if (!googleId || !email) {
    document.getElementById('alert').className = 'alert alert-danger';
    document.getElementById('alert').textContent = 'Faltan datos de Google. Inicia el flujo de nuevo desde el login.';
    return;
  }

  document.getElementById('view-rol').classList.remove('d-none');
  document.getElementById('google_id').value = googleId;
  document.getElementById('email').value = email;
  document.getElementById('avatar_url').value = avatar;
  document.getElementById('nombre-google').textContent = nombre || 'Usuario de Google';
  document.getElementById('email-google').textContent = email;
  if (avatar) document.getElementById('foto-google').src = avatar;
}

document.getElementById('form-rol')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById('alert');
  const btn = document.getElementById('btn-completar');
  btn.disabled = true;
  btn.textContent = 'Creando cuenta...';

  try {
    const role = document.querySelector('input[name="role"]:checked')?.value ?? 'student';

    const res = await fetch(`${API_BASE}/auth/google/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        google_id: googleId,
        email: email,
        name: nombre || null,
        avatar_url: avatar || null,
        role,
      }),
    });

    const payload = await res.json();

    if (!res.ok) {
      throw new Error(payload.message ?? `Error ${res.status}`);
    }

    if (payload.status === 'pending_approval') {
      window.location.href = 'index.html?google_status=pending';
      return;
    }

    Auth.clear();
    Auth.save(payload.token, payload.user);
    window.location.href = payload.user.role === 'teacher' ? 'docente.html' : 'estudiante.html';
  } catch (err) {
    alertEl.className = 'alert alert-danger';
    alertEl.textContent = err.message;
    alertEl.classList.remove('d-none');
    btn.disabled = false;
    btn.textContent = 'Continuar';
  }
});

boot();
</script>
</body>
</html>
