<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduGT — Evaluación Diagnóstica</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo-mark-32.png">
<link rel="apple-touch-icon" href="assets/img/logo-mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/app.css?v=20261015_04" rel="stylesheet">
</head>
<body>

<main class="container py-4" style="max-width: 720px;">
  <!-- Barra de Navegación Superior -->
  <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
    <a href="estudiante.html" class="btn btn-google shadow-xs">
      <i class="bi bi-arrow-left"></i> Volver a mi panel
    </a>
    <div class="d-flex align-items-center gap-2">
      <span class="badge px-3 py-2 rounded-pill shadow-xs header-stat-pill" id="diag-badge-title">
        <i class="bi bi-compass-fill text-primary me-1"></i> <span id="diag-title-text">Prueba Diagnóstica</span>
      </span>
    </div>
  </div>

  <!-- Progreso -->
  <div class="card-edugt p-3 mb-4">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <span class="fw-bold" style="font-size:.88rem; color:var(--edugt-text);" id="progress-label">Pregunta 1 de —</span>
      <span class="badge px-2.5 py-1 header-stat-pill" style="font-size:.78rem;" id="timer-label">
        <i class="bi bi-stopwatch text-primary me-1"></i> 15 min sugeridos
      </span>
    </div>
    <div class="progress-edugt" role="progressbar" aria-label="Progreso de la prueba">
      <div class="bar" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div id="alert" class="alert d-none"></div>

  <!-- Tarjeta Card-Flow -->
  <section class="card-edugt p-4 p-md-5 animate-fade-in" id="quiz-card">
    <div class="text-center py-5">
      <div class="stat-icon mx-auto mb-3" style="width:64px;height:64px;background:var(--edugt-primary-soft);color:var(--edugt-primary);border-radius:18px;">
        <i class="bi bi-card-text" style="font-size:1.8rem"></i>
      </div>
      <p class="mb-0" style="color:var(--edugt-muted)">Cargando tu prueba...</p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js?v=20261020_04"></script>
<script src="assets/js/diagnostico.js?v=20261020_04"></script>
</body>
</html>
