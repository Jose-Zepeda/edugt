<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduGT — Evaluación de Módulo</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo-mark-32.png">
<link rel="apple-touch-icon" href="assets/img/logo-mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/app.css?v=20261006_06" rel="stylesheet">
</head>
<body style="background: var(--edugt-bg);">

<main class="container py-4" style="max-width: 760px;">
  <!-- Barra de Navegación Superior -->
  <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
    <a href="estudiante.html" class="btn btn-google shadow-xs">
      <i class="bi bi-arrow-left"></i> Volver a mi ruta
    </a>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-white text-dark border px-3 py-2 rounded-pill shadow-xs" id="quiz-badge-title">
        <i class="bi bi-award-fill text-warning me-1"></i> Evaluación de Módulo
      </span>
    </div>
  </div>

  <!-- Barra de Progreso Superior -->
  <div class="card-edugt p-3 mb-4">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <span class="fw-bold text-dark" style="font-size:.88rem;" id="progress-label">Pregunta 1 de —</span>
      <span class="badge bg-light text-muted border px-2.5 py-1" style="font-size:.78rem;">
        Aprobación: <strong>70%</strong>
      </span>
    </div>
    <div class="progress-edugt" role="progressbar" aria-label="Progreso de la evaluación">
      <div class="bar" id="progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div id="alert" class="alert d-none"></div>

  <!-- Tarjeta Principal de la Evaluación -->
  <section class="lesson-card p-4 p-md-5 animate-fade-in" id="quiz-card">
    <div class="text-center py-5" style="color:var(--edugt-muted)">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <p class="mb-0">Cargando evaluación y preguntas...</p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="assets/js/api.js?v=20261006_06"></script>
<script src="assets/js/quiz.js?v=20261006_06"></script>
</body>
</html>
