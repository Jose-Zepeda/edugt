<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduGT — Evaluación</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo-mark-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body>

<main class="container py-4" style="max-width: 640px;">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <small class="fw-bold" style="color:var(--edugt-muted)" id="progress-label">Pregunta 1 de —</small>
    <small style="color:var(--edugt-muted)">Mínimo para aprobar: <strong>70</strong></small>
  </div>
  <div class="progress-edugt mb-4" role="progressbar" aria-label="Progreso del quiz">
    <div class="bar" id="progress-bar" style="width:0%"></div>
  </div>

  <div id="alert" class="alert d-none"></div>

  <section class="card-edugt p-4 p-md-5" id="quiz-card">
    <div class="text-center py-5" style="color:var(--edugt-muted)">Cargando evaluación...</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/quiz.js"></script>
</body>
</html>
