<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduGT — Inicia sesión</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo-mark-32.png">
<link rel="apple-touch-icon" href="assets/img/logo-mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<!-- Cloudflare Turnstile Script -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>

<main class="container py-4" style="max-width: 480px;">
  <div class="text-center mb-4 pt-4">
    <img src="assets/img/logo-mark-64.png" alt="Logo EduGT" width="56" height="56" style="border-radius:18px;" class="mx-auto mb-3 d-block">
    <h1 class="fw-bold mb-1" style="font-size:1.6rem;">EduGT</h1>
    <p class="mb-0" style="color:var(--edugt-muted)">Aprende lógica de programación básica</p>
  </div>

  <!-- Alerta de estado (docente pendiente, credenciales, etc.) -->
  <div id="alert" class="alert d-none" role="alert"></div>

  <!-- ============ LOGIN ============ -->
  <section id="view-login" class="card-edugt p-4 p-md-5 mb-3">
    <h2 class="h5 fw-bold mb-3">Inicia sesión</h2>

    <form id="form-login" novalidate>
      <!-- Honeypot anti-spam (invisible para humanos) -->
      <div style="position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;" aria-hidden="true">
        <input type="text" name="website_hp" id="login-website-hp" tabindex="-1" autocomplete="off">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="login-email">Correo electrónico</label>
        <input type="email" class="form-control form-control-edugt" id="login-email"
               placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" for="login-password">Contraseña</label>
        <input type="password" class="form-control form-control-edugt" id="login-password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <!-- Turnstile CAPTCHA Widget -->
      <div id="turnstile-login" class="mb-3 d-flex justify-content-center"></div>

      <button type="submit" class="btn btn-edugt w-100 mb-3" id="btn-login">Entrar</button>

      <div class="text-center my-3" style="color:var(--edugt-muted);font-size:.85rem;">— o —</div>

      <a class="btn btn-google w-100" id="btn-google" href="http://localhost:8080/api/v1/auth/google/redirect">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.8 6c4.5-4.2 6.8-10.3 6.8-17.7z"/><path fill="#FBBC05" d="M10.4 28.7a14.5 14.5 0 0 1 0-9.4l-7.8-6.1a24 24 0 0 0 0 21.6l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.3-5.6l-7.8-6c-2.1 1.4-4.8 2.3-7.5 2.3-6.3 0-11.7-3.7-13.6-9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Continuar con Google
      </a>
    </form>

    <p class="text-center mt-4 mb-0" style="font-size:.9rem;">
      ¿No tienes cuenta?
      <a href="#" id="link-to-register" class="fw-bold" style="color:var(--edugt-primary)">Regístrate</a>
    </p>
  </section>

  <!-- ============ REGISTRO ============ -->
  <section id="view-register" class="card-edugt p-4 p-md-5 mb-3 d-none">
    <h2 class="h5 fw-bold mb-3">Crea tu cuenta</h2>

    <form id="form-register" novalidate>
      <!-- Honeypot anti-spam (invisible para humanos) -->
      <div style="position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;" aria-hidden="true">
        <input type="text" name="website_hp" id="reg-website-hp" tabindex="-1" autocomplete="off">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="reg-name">Nombre</label>
        <input type="text" class="form-control form-control-edugt" id="reg-name" placeholder="Tu nombre" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" for="reg-email">Correo electrónico</label>
        <input type="email" class="form-control form-control-edugt" id="reg-email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" for="reg-password">Contraseña</label>
        <input type="password" class="form-control form-control-edugt" id="reg-password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>
      </div>

      <fieldset class="mb-3">
        <legend class="form-label fw-semibold mb-2">Soy...</legend>
        <div class="d-grid gap-2">
          <label class="border rounded-3 p-3 d-flex align-items-center gap-3" style="cursor:pointer;border-color:var(--edugt-border)!important;">
            <input type="radio" name="role" value="student" checked style="accent-color:var(--edugt-primary);width:1.15rem;height:1.15rem;">
            <i class="bi bi-mortarboard-fill" style="color:var(--edugt-primary);font-size:1.2rem;"></i>
            <span><strong>Estudiante</strong><br><small style="color:var(--edugt-muted)">Aprende y gana XP</small></span>
          </label>
          <label class="border rounded-3 p-3 d-flex align-items-center gap-3" style="cursor:pointer;border-color:var(--edugt-border)!important;">
            <input type="radio" name="role" value="teacher" style="accent-color:var(--edugt-primary);width:1.15rem;height:1.15rem;">
            <i class="bi bi-person-video3" style="color:var(--edugt-primary);font-size:1.2rem;"></i>
            <span><strong>Docente</strong><br><small style="color:var(--edugt-muted)">Requiere aprobación del administrador</small></span>
          </label>
        </div>
        <!-- RB-01: el rol admin jamás aparece como opción de registro -->
      </fieldset>

      <!-- Turnstile CAPTCHA Widget -->
      <div id="turnstile-register" class="mb-3 d-flex justify-content-center"></div>

      <button type="submit" class="btn btn-edugt w-100" id="btn-register">Crear cuenta</button>
    </form>

    <p class="text-center mt-4 mb-0" style="font-size:.9rem;">
      ¿Ya tienes cuenta?
      <a href="#" id="link-to-login" class="fw-bold" style="color:var(--edugt-primary)">Inicia sesión</a>
    </p>
  </section>

  <p class="text-center text-edugt-muted" style="color:var(--edugt-muted);font-size:.8rem;">
    EduGT · Plataforma educativa gamificada · Jutiapa, Guatemala
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js?v=1.1"></script>
</body>
</html>
