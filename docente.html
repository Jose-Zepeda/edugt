<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduGT — Panel docente</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo-mark-32.png">
<link rel="apple-touch-icon" href="assets/img/logo-mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid p-3 p-lg-4">
  <div class="row g-3">

    <!-- ============ SIDEBAR ============ -->
    <aside class="col-lg-2 d-none d-lg-block">
      <nav class="sidebar-edugt p-3 h-100 d-flex flex-column" aria-label="Navegación principal">
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
          <img src="assets/img/logo-mark-48.png" alt="Logo EduGT" width="42" height="42" style="border-radius:14px;">
          <span class="fw-bold" style="font-size:1.05rem;">EduGT</span>
        </div>
        <ul class="nav nav-pills flex-column gap-1 mb-auto">
          <li><a class="nav-link active" href="docente.html"><i class="bi bi-house-door"></i> Inicio</a></li>
          <li><a class="nav-link" href="docente.html#aulas"><i class="bi bi-people"></i> Mis aulas</a></li>
          <li><a class="nav-link" href="docente.html#reportes"><i class="bi bi-file-earmark-pdf"></i> Reportes</a></li>
        </ul>
        <button class="btn btn-edugt w-100 mt-3" id="btn-logout"><i class="bi bi-box-arrow-right"></i> Salir</button>
      </nav>
    </aside>

    <!-- ============ CONTENIDO ============ -->
    <main class="col-12 col-lg-10 pb-5" style="padding-bottom:5.5rem!important;">
      <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <div>
          <small style="color:var(--edugt-muted)" id="greeting-kicker">Bienvenido</small>
          <h1 class="h4 fw-bold mb-0" id="greeting">—</h1>
        </div>
        <button class="btn btn-edugt d-lg-none" id="btn-logout-m" aria-label="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>

      <!-- Alert docente pendiente (RB-02) -->
      <div id="alert" class="alert d-none"></div>

      <!-- ===== AULAS ===== -->
      <section id="aulas" class="mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="h5 fw-bold mb-0"><i class="bi bi-people" style="color:var(--edugt-primary)"></i> Mis aulas</h2>
          <button class="btn btn-edugt" data-bs-toggle="modal" data-bs-target="#modal-aula"><i class="bi bi-plus-lg"></i> Nueva aula</button>
        </div>
        <div id="classrooms" class="row g-3"></div>
      </section>

      <!-- ===== REPORTES (RF-22) ===== -->
      <section id="reportes" class="card-edugt p-4">
        <h2 class="h5 fw-bold mb-3"><i class="bi bi-file-earmark-pdf" style="color:var(--edugt-primary)"></i>Generar reporte en PDF</h2>
        <p class="mb-3" style="color:var(--edugt-muted);font-size:.9rem;">
          Los reportes se generan en PDF exclusivamente, con métricas de tu aula: promedio, tasa de aprobación,
          estudiantes en riesgo y comparación pretest ↔ postest.
        </p>
        <form id="form-reporte" class="row g-3 align-items-end">
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="reporte-aula">Aula</label>
            <select class="form-control form-control-edugt" id="reporte-aula" required>
              <option value="">Cargando aulas...</option>
            </select>
          </div>
          <div class="col-md-3">
            <button type="submit" class="btn btn-edugt w-100" id="btn-reporte"><i class="bi bi-download"></i> Descargar PDF</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>

<!-- ============ MODAL NUEVA AULA (RF-19) ============ -->
<div class="modal fade" id="modal-aula" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:var(--edugt-radius);border:none;">
      <div class="modal-header" style="border:none;">
        <h5 class="modal-title fw-bold">Crear nueva aula</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body px-4">
        <div id="modal-alert" class="alert d-none"></div>
        <form id="form-aula">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="aula-nombre">Nombre del aula</label>
            <input type="text" class="form-control form-control-edugt" id="aula-nombre" placeholder="Cuarto Bachillerato A" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="aula-institucion">Institución</label>
            <input type="text" class="form-control form-control-edugt" id="aula-institucion" placeholder="Instituto de Jutiapa">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="aula-grado">Grado</label>
            <input type="text" class="form-control form-control-edugt" id="aula-grado" placeholder="Quinto bachillerato / Perito contador">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold" for="aula-anio">Año académico</label>
            <input type="text" class="form-control form-control-edugt" id="aula-anio" placeholder="2026" required>
          </div>
          <button type="submit" class="btn btn-edugt w-100">Crear aula</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Nav inferior móvil -->
<nav class="bottom-nav d-flex justify-content-around px-3 d-lg-none" aria-label="Navegación móvil">
  <a href="docente.html" class="active"><i class="bi bi-house-door"></i>Inicio</a>
  <a href="docente.html#aulas"><i class="bi bi-people"></i>Aulas</a>
  <a href="docente.html#reportes"><i class="bi bi-file-earmark-pdf"></i>Reportes</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/docente.js"></script>
</body>
</html>
