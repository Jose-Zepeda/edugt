<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduGT — Prueba inicial</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo-mark-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body>

<main class="container py-4" style="max-width: 640px;">
  <!-- Progreso -->
  <div class="d-flex align-items-center justify-content-between mb-2">
    <small class="fw-bold" style="color:var(--edugt-muted)" id="progress-label">Pregunta 1 de —</small>
    <small style="color:var(--edugt-muted)" id="timer-label">⏱ 15 min</small>
  </div>
  <div class="progress-edugt mb-4" role="progressbar" aria-label="Progreso de la prueba">
    <div class="bar" id="progress-bar" style="width:0%"></div>
  </div>

  <div id="alert" class="alert d-none"></div>

  <!-- Tarjeta Card-Flow -->
  <section class="card-edugt p-4 p-md-5" id="quiz-card">
    <div class="text-center py-5">
      <div class="stat-icon mx-auto mb-3" style="width:64px;height:64px;background:var(--edugt-primary-soft);color:var(--edugt-primary)">
        <i class="bi bi-card-text" style="font-size:1.6rem"></i>
      </div>
      <p class="mb-0" style="color:var(--edugt-muted)">Cargando tu prueba...</p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/diagnostico.js"></script>
</body>
</html>
