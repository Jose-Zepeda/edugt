<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduGT — Administración</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo-mark-32.png">
<link rel="apple-touch-icon" href="assets/img/logo-mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid p-3 p-lg-4">
  <div class="row g-3">

    <!-- SIDEBAR -->
    <aside class="col-lg-2 d-none d-lg-block">
      <nav class="sidebar-edugt p-3 h-100 d-flex flex-column" aria-label="Navegación principal">
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
          <img src="assets/img/logo-mark-48.png" alt="Logo EduGT" width="42" height="42" style="border-radius:14px;">
          <span class="fw-bold" style="font-size:1.05rem;">EduGT</span>
        </div>
        <ul class="nav nav-pills flex-column gap-1 mb-auto">
          <li><a class="nav-link active" href="admin.html"><i class="bi bi-speedometer2"></i> Resumen</a></li>
          <li><a class="nav-link" href="admin.html#docentes"><i class="bi bi-person-video3"></i> Docentes</a></li>
          <li><a class="nav-link" href="admin.html#soporte"><i class="bi bi-life-preserver"></i> Soporte</a></li>
          <li><a class="nav-link" href="admin.html#bitacora"><i class="bi bi-journal-text"></i> Bitácora</a></li>
        </ul>
        <button class="btn btn-edugt w-100 mt-3" id="btn-logout"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
      </nav>
    </aside>

    <!-- CONTENIDO -->
    <main class="col-12 col-lg-10 pb-5" style="padding-bottom:5.5rem!important;">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
          <small style="color:var(--edugt-muted)">Panel administrativo</small>
          <h1 class="h4 fw-bold mb-0" id="greeting">—</h1>
        </div>
        <button class="btn btn-edugt d-lg-none" id="btn-logout-m"><i class="bi bi-box-arrow-right"></i></button>
      </div>

      <div id="alert" class="alert d-none"></div>

      <!-- DOCENTES -->
      <section id="docentes" class="card-edugt p-4 mb-4">
        <h2 class="h5 fw-bold mb-3"><i class="bi bi-person-video3" style="color:var(--edugt-primary)"></i> Cuentas docentes pendientes de aprobación</h2>
        <div id="pending-teachers" class="d-flex flex-column gap-2"></div>
      </section>

      <!-- SOPORTE -->
      <section id="soporte" class="card-edugt p-4 mb-4">
        <h2 class="h5 fw-bold mb-3"><i class="bi bi-life-preserver" style="color:var(--edugt-pink)"></i> Tickets de soporte</h2>
        <div class="d-flex gap-2 mb-3" id="ticket-filters" role="group" aria-label="Filtrar tickets por estado">
          <button class="btn btn-sm btn-edugt" data-status="">Todos</button>
          <button class="btn btn-sm btn-google" data-status="open">Abiertos</button>
          <button class="btn btn-sm btn-google" data-status="in_review">En revisión</button>
          <button class="btn btn-sm btn-google" data-status="resolved">Resueltos</button>
        </div>
        <div id="tickets" class="d-flex flex-column gap-2"></div>
      </section>

      <!-- BITÁCORA -->
      <section id="bitacora" class="card-edugt p-4">
        <h2 class="h5 fw-bold mb-3"><i class="bi bi-journal-text" style="color:var(--edugt-amber)"></i> Bitácora de acciones administrativas</h2>
        <div id="audit-logs" class="d-flex flex-column gap-1"></div>
      </section>
    </main>
  </div>
</div>

<nav class="bottom-nav d-flex justify-content-around px-3 d-lg-none" aria-label="Navegación móvil">
  <a href="admin.html" class="active"><i class="bi bi-speedometer2"></i>Resumen</a>
  <a href="admin.html#docentes"><i class="bi bi-person-video3"></i>Docentes</a>
  <a href="admin.html#soporte"><i class="bi bi-life-preserver"></i>Soporte</a>
  <a href="admin.html#bitacora"><i class="bi bi-journal-text"></i>Bitácora</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
