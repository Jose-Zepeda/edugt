server {
    listen 80;
    server_name _;

    root /var/www/frontend;
    index index.html;

    client_max_body_size 20M;

    # Compresión Gzip para carga rápida en redes móviles (RNF-01)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # 1. Rutas del API Laravel (/api/v1/...) y healthcheck (/up)
    location ^~ /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Procesamiento PHP-FPM hacia el contenedor de Laravel
    location = /index.php {
        root /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # 2. Archivos estáticos del Frontend (HTML, CSS, JS, PWA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a archivos ocultos excepto .well-known (Certbot SSL)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
