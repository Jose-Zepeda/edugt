name: edugt

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edugt-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=edugt
      - DB_USERNAME=edugt
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edugt

  nginx:
    image: nginx:1.27-alpine
    container_name: edugt-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - edugt

  mysql:
    image: mysql:8.0
    container_name: edugt-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: edugt
      MYSQL_USER: edugt
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pedugt", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - edugt

  redis:
    image: redis:7-alpine
    container_name: edugt-redis
    restart: unless-stopped
    networks:
      - edugt

volumes:
  mysql_data:

networks:
  edugt:
