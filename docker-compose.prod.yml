name: edugt-prod

services:
  app:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    container_name: edugt-app
    restart: always
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-edugt}
      - DB_USERNAME=${DB_USERNAME:-edugt}
      - DB_PASSWORD=${DB_PASSWORD:-edugt_prod_secret_2026}
      - REDIS_HOST=redis
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edugt

  nginx:
    image: nginx:1.27-alpine
    container_name: edugt-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./frontend:/var/www/frontend:ro
      - ./backend/docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - edugt

  mysql:
    image: mysql:8.0
    container_name: edugt-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-edugt}
      MYSQL_USER: ${DB_USERNAME:-edugt}
      MYSQL_PASSWORD: ${DB_PASSWORD:-edugt_prod_secret_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-edugt_root_secret_2026}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - edugt

  redis:
    image: redis:7-alpine
    container_name: edugt-redis
    restart: always
    networks:
      - edugt

volumes:
  mysql_prod_data:

networks:
  edugt:
